<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | Page Not Found</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="error.css">
</head>

<body>

    <main class="error-page">

        <div class="error-background">
            <div class="error-grid"></div>
            <div class="error-glow error-glow-one"></div>
            <div class="error-glow error-glow-two"></div>
        </div>

        <div class="error-top">

            <a href="index.html" class="error-logo">
                <img src="Assest/whitelogo.webp" alt="Stackly">
            </a>

            <span class="error-label">
                ERROR / 404
            </span>

        </div>

        <section class="error-content">

            <div class="error-number-wrap">

                <div class="error-number-bg">
                    404
                </div>

                <h1 class="error-number">
                    <span>4</span>
                    <span>0</span>
                    <span>4</span>
                </h1>

                <div class="error-orbit error-orbit-one"></div>
                <div class="error-orbit error-orbit-two"></div>

                <div class="error-symbol">
                    <i class="fa-solid fa-arrow-up-right"></i>
                </div>

            </div>

            <div class="error-message">

                <span class="error-eyebrow">
                    <i class="fa-solid fa-circle"></i>
                    SOMETHING WENT OFF COURSE
                </span>

                <h2>
                    This page
                    <span>doesn't exist.</span>
                </h2>

                <p>
                    The page you're looking for may have been moved,
                    deleted, or the address may be incorrect.
                </p>

                <div class="error-actions">

      <button type="button" class="error-back" id="errorBack">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Go Back</span>
</button>

                    <a href="index.html" class="error-home">
                        <span>Back to Home</span>
                        <i class="fa-solid fa-arrow-up-right"></i>
                    </a>

                </div>

            </div>

        </section>

        <div class="error-bottom">

            <span>STACKLY CREATIVE STUDIO</span>

            <div class="error-line"></div>

            <span>PAGE NOT FOUND</span>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="error.js"></script>

</body>
</html>
